name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk and test tools
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils p7zip-full libsodium23 fonts-dejavu-core

      - name: Fetch PDFium
        run: tools/pdfium/fetch.sh

      - name: Build the native core
        run: native/build.sh

      - name: Rust tests
        working-directory: native
        run: cargo test --release

      - name: Build the debug APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: JVM tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: strata-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
