name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch PDFium
        run: tools/pdfium/fetch.sh

      - name: Build the native core
        run: native/build.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STRATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STRATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STRATA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the STRATA_KEYSTORE_BASE64, STRATA_KEYSTORE_PASSWORD, STRATA_KEY_ALIAS and STRATA_KEY_PASSWORD secrets to sign releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build the release APK
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Strata-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Strata-${GITHUB_REF_NAME}.apk" --title "Strata ${GITHUB_REF_NAME}" --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks keystore.properties
