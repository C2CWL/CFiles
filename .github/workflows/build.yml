name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, test and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk and test tools
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils p7zip-full libsodium23 fonts-dejavu-core

      - name: Fetch PDFium
        run: tools/pdfium/fetch.sh

      - name: Build the native core
        run: native/build.sh

      - name: Rust tests
        working-directory: native
        run: cargo test --release

      - name: Build the debug APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: JVM tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: strata-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.STRATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STRATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STRATA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the STRATA_KEYSTORE_BASE64, STRATA_KEYSTORE_PASSWORD, STRATA_KEY_ALIAS and STRATA_KEY_PASSWORD secrets to sign releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build the signed release APKs
        if: github.event_name != 'pull_request'
        run: |
          version=$(grep '^strata.versionName=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match strata.versionName=${version} in gradle.properties."
            exit 1
          fi
          ./gradlew --stacktrace :app:assembleRelease -Pstrata.splitApks=true
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/Strata-v${version}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload the signed release APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: strata-release
          path: |
            dist/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Strata ${GITHUB_REF_NAME}" --generate-notes

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks keystore.properties
